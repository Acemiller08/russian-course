  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}

function diffMark(typed, correct) {

  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === bl[j - 1] ? 0 : 1));
  const bad = new Array(n).fill(false); let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === bl[j - 1] ? 0 : 1)) { if (a[i - 1] !== bl[j - 1]) bad[j - 1] = true; i--; j--; }
    else if (j > 0 && d[i][j] === d[i][j - 1] + 1) { bad[j - 1] = true; j--; }
    else { if (j > 0) bad[j - 1] = true; else if (j === 0 && n) bad[0] = true; i--; }

function lcsWords(a, b) { // length of longest common subsequence + matched flags on b
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  const ok = new Array(n).fill(false); let i = m, j = n;
  while (i > 0 && j > 0) { if (a[i - 1] === b[j - 1]) { ok[j - 1] = true; i--; j--; } else if (d[i - 1][j] >= d[i][j - 1]) i--; else j--; }
  return { n: d[m][n], ok };

        <li><b>Take the Diagnostic.</b> Do the six parts in any order; one part takes about 10–20 minutes.</li>
        <li><b>Open the Coach.</b> It reads your mistakes, explains your biggest problems and drills them.</li>
        <li><b>Do Practice every day.</b> It’s built from your Diagnostic and takes about 15 minutes.</li>
        <li><b>Use Grind, Words and Names & Numbers</b> whenever you have extra time.</li>
        <li><b>Check Results</b> to see what’s improving and what still needs work.</li>

    <h2>A good routine</h2>
    <div class="card"><ul class="small" style="margin:0">
      <li><b>Every day:</b> one Practice session. Add a Grind round or two if you have time.</li>
      <li><b>When a new lesson starts:</b> move “I’m on” to it, study its list in Words, then in the Diagnostic choose “One lesson” and test just that lesson.</li>

  const out = []; for (const [, e] of cand.slice(0, n * 4)) if (!out.includes(e)) out.push(e);
  return shuffle([s.en, ...pick(out.slice(0, n * 3), n)]);
}
// Authored grammar choices are the real contrast (ходит / идёт…). With only two or three, add one misspelled copy of an option as a trap.
function trapOpts(mc, ans) {
  const a = Array.isArray(ans) ? ans[0] : ans;
  if (mc.length >= 4 || !a || a.length < 4 || /—|\s/.test(a) || !/[а-яё]/i.test(a)) return shuffle(mc.slice());
  const v = variants(a).filter(x => !mc.some(m => norm(m) === norm(x)));
  return shuffle(v.length ? [...mc, matchCase(a, v[0])] : mc.slice());
}

/* ============================== SCOPE (progressive diagnostic) ============================== */
const hasContent = l => BANK.some(w => w.l === l) || SENT.some(x => x.l === l) || LGRAM.some(g => g.l === l) || QA.some(q => q.l === l);

const oneChoices = () => Object.keys(COURSE_TITLES).map(Number).filter(l => l <= curLesson() && (hasContent(l) || reviewOf(l)));
const expandL = l => reviewOf(l) || [l];

  const s = state.dscope || { m: 'all' }, ok = scopeChoices();
  if (s.m === 'one') return oneChoices().includes(s.l) ? expandL(s.l) : [ok[ok.length - 1]];
  if (s.m === 'pick') { const a = (s.ls || []).filter(l => ok.includes(l)).sort((a, b) => a - b); return a.length ? a : [ok[ok.length - 1]]; }

const coreIn = () => scopeLessons().some(l => l <= 12);
function scopeKeys() { const k = new Set(scopeLessons()); if (scopeFull() || coreIn()) k.add(0); return k; }
function scopeLabel(ls = null, full = scopeFull()) {
  const mine = !ls; ls = ls || scopeLessons();
  if (full) return `Lessons 1–${curLesson()}`;
  if (mine && state.dscope?.m === 'one' && reviewOf(state.dscope.l)) return `Lesson ${state.dscope.l} (review of ${scopeLabel(ls.slice(), false).replace('Lessons ', '')})`;
  if (ls.length === 1) return `Lesson ${ls[0]}`;
  const runs = []; for (const l of ls) { const r = runs[runs.length - 1]; if (r && l === r[1] + 1) r[1] = l; else runs.push([l, l]); }

function balanced(pool, n, key = x => x.topic) { // round-robin across groups so one topic can't crowd out the rest

  const groups = shuffle(Object.values(g)), out = [];

// Builds used when only some lessons are selected. Core Lessons 1–12 items without a lesson tag join in only when the scope includes those lessons.
const FOCUS = {

    for (const x of PEOPLE.filter(x => S.has(x.l))) it.push({ t: 'case', topic: TOPIC_CASE.objP, l: x.l, p: 'Я хорошо знаю ___ .', cue: `(${x.n})`, ans: [x.acc] }, { t: 'case', topic: TOPIC_CASE.plP, l: x.l, p: 'Это наши ___ .', cue: `(${x.n} → plural)`, ans: [x.pl] }, { t: 'case', topic: TOPIC_CASE.about, l: x.l, p: 'Она часто рассказывает ___ .', cue: `(о + ${x.n})`, ans: [x.ab] });

  grammar() {

/* ---------- pooling: every run feeds one overall picture; per lesson, the newest attempt counts ---------- */
function recKey(x) {
  if (x.l != null && x.l !== '') return +x.l;
  if (x.t === 'pass') { const P = PASSAGES.find(p => p.id === x.id); return P?.l || 0; }
  if ((x.t === 'vocab' || x.t === 'ear') && WORD[x.id]) return WORD[x.id].l;
  return 0; // core Lessons 1–12 mix
}
function recFrac(x) { return x.t === 'vocab' ? x.lvl / 3 : x.t === 'tr' ? x.rating / 3 : x.t === 'speak' ? x.rating / 2 : x.t === 'pass' ? x.score / (x.of || 1) : x.t === 'dict' ? x.correct / (x.words || 1) : x.ok ? 1 : 0; }
function pooled(k, keys = null) {
  const runs = state.results.filter(r => r.section === k); if (!runs.length) return null;
  const recs = [], claimed = new Set(), seenW = new Set(); let last = 0, n = 0;
  for (const r of runs) { // newest first
    const mine = new Set(); let used = false;
    for (const x of r.recs || []) {
      const key = recKey(x); if (keys && !keys.has(key)) continue;
      if (k === 'vocab') { if (seenW.has(x.id)) continue; seenW.add(x.id); }
      else { if (claimed.has(key)) continue; mine.add(key); }
      recs.push(x); used = true;
    }
    mine.forEach(q => claimed.add(q)); if (used) { n++; last = Math.max(last, r.finishedAt); }
  }
  if (!recs.length) return null;
  return { section: k, pooled: true, runs: n, finishedAt: last, summary: Object.assign(SUMMARIZE[k](recs), { time: timing(recs) }), recs };
}
const DIAG_KEYS = () => Object.keys(SECTIONS).filter(k => !SECTIONS[k].hidden);
function lessonGrid() { // {lesson: {section: [sum, n]}}
  const g = {};
  for (const k of DIAG_KEYS()) { const P = pooled(k); if (!P) continue; for (const x of P.recs) { const l = recKey(x); g[l] = g[l] || {}; const c = g[l][k] = g[l][k] || [0, 0]; c[0] += recFrac(x); c[1]++; } }
  return g;
}

function startSection(sec, opt = {}) {

  const items = diag && !scopeFull() && FOCUS[sec] ? FOCUS[sec](opt) : SECTIONS[sec].build(opt);
  if (!items.length) { toast(diag ? `There isn’t enough ${SECTIONS[sec].title.toLowerCase()} material in ${scopeLabel()} yet. Pick more lessons.` : 'Nothing to practice with these settings yet. Try more skills or a later lesson.'); return; }
  state.run = { sec, opt, items, idx: 0, recs: [], startedAt: Date.now() };

async function finishPractice(res) {

  for (const [id, o] of Object.entries(outcome)) {
    const p = state.progress[id] || { n: 0, best: 0, box: 0 };
    const before = p.box ?? 0;
    if (o.first && !o.slow) p.box = Math.min(5, before + 1);
    else if (o.first && o.slow) p.box = Math.max(1, before);
    else p.box = 0;
    if (p.box > before) up++; else if (p.box < before) down++;
    p.due = now + Math.max(0.8, INTERVALS[p.box]) * DAY;
    p.n = (p.n || 0) + 1; p.last = o.first ? 3 : 1; p.best = Math.max(p.best || 0, p.last); p.t = now;
    state.progress[id] = p;
  }

  const sc = state.scripts = state.scripts || {};
  for (const r of res.recs) if (r.t === 'script') { const s = sc[r.i] || { box: 0 }; s.box = r.rating === 2 ? Math.min(5, s.box + 1) : r.rating === 1 ? s.box : 0; s.due = now + Math.max(0.8, INTERVALS[s.box]) * DAY; sc[r.i] = s; }
  LS.set('scripts', sc);
  res.summary.moved = { up, down };
  if (db) {
    try { await db.doc('progress/words').set({ words: state.progress, updatedAt: now }); } catch (e) {}
    try { await db.doc('progress/scripts').set({ scripts: sc, updatedAt: now }); } catch (e) {}
    try { await db.collection('results').doc(res.rid).set(res); } catch (e) {}
  }
}

function wirePractice(el) {

    state.myScripts = mine; LS.set('myScripts', mine);

 time washing the dishes.", "qs": [["Who were the guests?", ["Grandparents", "The narrator's cousin with his wife, and the neighbors", "Coworkers", "Only the neighbors"], 1], ["When did the guests arrive?", ["At exactly 10 p.m.", "At midnight", "At 8 p.m.", "At 3 a.m."], 0], ["What did Mom make?", ["Blini", "Cookies", "A big sweet pie", "Ice cream"], 2], ["What did they wish each other at midnight?", ["Success at work", "A good trip", "Victory", "Health and happiness"], 3], ["What did they do in the morning?", ["Slept until noon", "Washed the dishes for a long time", "Went to visit relatives", "Cooked again"], 1], ["What can you infer?", ["The party was long and lively", "The guests left early", "The narrator dislikes New Year's", "There was little food"], 0]], "facts": ["New Year's is the narrator's favorite holiday", "Guests: cousin with his wife and the neighbors", "They arrived at exactly 10 p.m.", "Appetizers: sausage, cabbage salad, meat pirozhki", "Mom baked a big sweet pie", "At midnight they congratulated each other", "They wished health and happiness", "Guests left at 3 a.m.", "They washed dishes in the morning"]}]}, {"l": 26, "title": "Свободное время и увлечения", "words": [["необходим", "necessary, essential, vital"], ["необходима", "necessary, essential, vital"], ["необходимо", "necessary, essential, vital"], ["необходимы", "necessary, essential, vital"], ["нужен", "necessary, needed"], ["нужна", "necessary, needed"], ["нужно", "necessary, needed"], ["нужны", "necessary, needed"], ["хочется", "to want, to feel like (doing something)"], ["хотелось", "wanted, felt like (doing something)"], ["бедный", "poor"], ["богатый", "rich"], ["брать", "to take, to get (impf.)"], ["взять", "to take, to get (pf.)"], ["ведь", "after all; because, since"], ["вместо", "instead (of), in place of"], ["во-вторых", "in the second place, secondly"], ["во-первых", "in the first place, first of all"], ["в-третьих", "in the third place, thirdly"], ["довольно", "quite, rather"],       ${Object.keys(s.tags).length ? `<h3>What went wrong most</h3><div class="bars">${Object.entries(s.tags).sort((a, b) => b[1] - a[1]).map(([t, v]) => bar(t, v, s.n)).join('')}</div>` : ''}`;
    case 'listening': return `<div class="bars">${s.passages.map((p, i) => bar(`Passage ${i + 1}${p.preview ? ' (preview)' : ''}${p.usedNotes ? ' (notes)' : ''}`, p.score, p.of)).join('')}
      ${bar('Dictation (words)', s.dictation.correct, s.dictation.words)}${bar('Words by ear', s.ear.ok, s.ear.n)}</div>`;
    case 'speaking': return `<div class="bars">${Object.entries(s.byKind).map(([k, v]) => bar({ read: 'Reading aloud', ask: 'Answering questions', retell: 'Listen and retell' }[k], v[0], v[1], ' pts')).join('')}</div>
      ${Object.keys(s.flags).length ? `<h3>What got in the way</h3><p>${Object.entries(s.flags).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)}: <b>${v}</b>`).join(' · ')}</p>` : ''}`;
  }
  return '';
}
function missedList(r) {
  const miss = r.recs.filter(x => !x.ok);
  if (!miss.length) return '';
  return `<h3>Missed items</h3><div class="tbl"><table><tr><th>Sentence</th><th>You wrote</th><th>Correct</th></tr>${miss.map(m => `<tr><td>${esc(m.p || m.label || '')} <span class="muted small">${esc(m.cue || '')}</span></td><td class="ru">${esc(m.typed || '—')}</td><td class="ru">${esc(m.ans)}</td></tr>`).join('')}</table></div>`;
}
function viewResults() {
  const P = Object.fromEntries(DIAG_KEYS().map(k => [k, pooled(k)])), done = DIAG_KEYS().filter(k => P[k]);
  if (!done.length) return `<h1>Results</h1><div class="sheet"><p>No results yet. Finish any part and its results show up here, broken down by lesson, topic and skill.</p><button class="btn" id="home">Go to the sections</button></div>${backupHTML()}`;
  const ranked = done.map(k => [k, P[k].summary.score]).sort((a, b) => a[1] - b[1]);
  const prog = wordsUpTo().map(w => state.progress[w.id]).filter(p => p?.n); const words = prog.length, solid = prog.filter(p => p.best === 3).length;
  return `<h1>Results</h1>
    <p class="small muted">Everything here is pooled from all your runs. For each lesson, your newest attempt counts and older ones drop out, so retesting a lesson updates its numbers without touching the others.</p>
    <div class="card"><div class="eyebrow">Weakest first</div><div class="bars" style="margin-top:6px">${ranked.map(([k, s]) => `<div class="bar"><span class="lab">${esc(SECTIONS[k].title)}</span><span class="track"><i class="${s >= 80 ? 's3' : s >= 60 ? 's1' : 's0'}" style="width:${s}%"></i></span><span class="num">${s}%</span></div>`).join('')}</div>
    <p class="small muted" style="margin-bottom:0">Words tested so far: ${words} of ${wordsUpTo().length} (Lessons 1–${curLesson()}). Spelled correctly at least once: ${solid}. Missing parts: ${DIAG_KEYS().filter(k => !P[k]).map(k => SECTIONS[k].title).join(', ') || 'none'}.</p></div>
    ${gridHTML()}
    ${done.map(k => { const r = P[k]; return `<h2>${SECTIONS[k].n}. ${esc(SECTIONS[k].title)} <span class="muted small" style="font-family:var(--body)">· ${r.runs} run${r.runs > 1 ? 's' : ''} · latest ${new Date(r.finishedAt).toLocaleDateString()}</span></h2>${sectionDetail(r)}`; }).join('')}
    <h2>Share your results</h2><p class="small">Copy a text summary to send to your instructor or a study partner.</p>
    <div class="actions"><button class="btn ghost" id="copy">Copy text summary</button></div><textarea class="notes" id="sumtxt" readonly hidden></textarea>${backupHTML()}`;
}
function textSummary() {
  const out = [];
  out.push('Pooled across all runs (newest attempt per lesson counts).');
  const G = lessonGrid(); out.push('By lesson: ' + Object.keys(G).map(Number).sort((a, b) => a - b).map(l => (l ? 'L' + l : 'core') + ' ' + DIAG_KEYS().filter(k => G[l][k]).map(k => k + ' ' + Math.round(100 * G[l][k][0] / G[l][k][1]) + '%').join('/')).join('; '));
  for (const k of DIAG_KEYS()) { const r = pooled(k); if (!r) continue; const s = r.summary; out.push(`${SECTIONS[k].title}: ${s.score}%` + (s.time ? ` · avg ${s.time.avg} s/question, median ${s.time.median} s; right but slow: ${s.time.slowCorrect.map(x => x.label).join(', ') || 'none'}` : ''));
    if (k === 'vocab') out.push(`  levels spelled/almost/recognized/unknown: ${s.levels.slice().reverse().join('/')}; weak: ${s.weak.map(id => WORD[id]?.ru).join(', ')}`);
    if (s.byTopic) out.push('  ' + Object.entries(s.byTopic).map(([t, v]) => `${t} ${v[0]}/${v[1]}`).join('; '));
    if (k === 'translate') out.push('  errors: ' + Object.entries(s.tags).map(([t, v]) => `${t} ${v}`).join(', '));
    if (k === 'listening') out.push(`  passages ${s.passages.map(p => p.score + '/' + p.of).join(', ')}; dictation ${s.dictation.pct}%; ear ${s.ear.pct}%`);
    if (k === 'speaking') out.push('  flags: ' + Object.entries(s.flags).map(([t, v]) => `${t} ${v}`).join(', '));
  }
  return out.join('\n');
}
function backupHTML() {
  return `<h2>Back up my progress</h2><p class="small">Everything you do is saved in this browser only. Download a backup file now and then, and use it to restore your progress on another device or browser.</p>
    <div class="actions"><button class="btn" id="bk">Download backup</button><label class="btn ghost" for="rs" style="cursor:pointer">Restore from backup</label><input type="file" id="rs" accept=".json,application/json" hidden></div>`;
}
function wireBackup(el) {
  const bk = el.querySelector('#bk'), rs = el.querySelector('#rs'); if (!bk) return;
  bk.onclick = () => {
    const data = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('ru12:')) data[k] = localStorage.getItem(k); } } catch (e) {}
    const blob = new Blob([JSON.stringify({ app: 'russian-course', saved: new Date().toISOString(), data })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'russian-course-backup-' + new Date().toLocaleDateString('en-CA') + '.json'; document.body.appendChild(a); a.click(); a.remove();
    toast('Backup downloaded');
  };
  rs.onchange = async () => {
    const f = rs.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.app !== 'russian-course' || !j.data) throw 0; for (const [k, v] of Object.entries(j.data)) localStorage.setItem(k, v); toast('Progress restored'); setTimeout(() => location.reload(), 800); }
    catch (e) { toast('That file isn’t a backup from this page.'); }
  };
}
function wireResults(el) {
  wireBackup(el);
  wireGrid(el);
  $('#home', el) && ($('#home', el).onclick = () => { state.view = 'home'; render(); });
  $('#copy', el) && ($('#copy', el).onclick = () => { const t = textSummary(); const ta = $('#sumtxt', el); ta.value = t; ta.hidden = false;
    navigator.clipboard?.writeText(t).then(() => toast('Copied'), () => { ta.select(); toast('Select the text and copy it'); }); });
}

function lessonOptions(cur) { return Object.entries(COURSE_TITLES).map(([l, t]) => `<option value="${l}" ${+l === cur ? 'selected' : ''}>Lesson ${l} · ${esc(t)}</option>`).join(''); }
async function setLesson(l) {
  state.gcur = l; LS.set('gcur', l);
  if (db) { try { await db.doc('progress/grind').set({ stats: state.gstats || {}, days: state.gdays || {}, cur: l, updatedAt: Date.now() }); } catch (e) {} }
  toast(`Set to Lesson ${l}. Everything now covers Lessons 1–${l}.`); render();
}
function render() {
  const gl = document.getElementById('gLesson'); if (gl) { gl.innerHTML = lessonOptions(curLesson()); gl.onchange = e => setLesson(+e.target.value); }
  const el = $('#app');
  document.querySelectorAll('.navb[data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view === state.view || (b.dataset.view === 'home' && ['home', 'setup'].includes(state.view))));
  if (state.view === 'run' && !state.run) state.view = 'home';
  if (state.view === 'home') { el.innerHTML = viewHome(); wireHome(el); }
  else if (state.view === 'setup') { el.innerHTML = viewSetup(); wireSetup(el); }
  else if (state.view === 'run') { el.innerHTML = viewRun(); wireRun(el); }
  else if (state.view === 'done' && state.lastSummary?.section === 'names') { el.innerHTML = namesRecap(state.lastSummary); $('#nagain', el).onclick = () => startSection('names', state.lastSummary.opt); $('#nback', el).onclick = () => { state.view = 'names'; render(); }; }
  else if (state.view === 'names') { el.innerHTML = viewNames(); wireNames(el); }
  else if (state.view === 'guide') { el.innerHTML = viewGuide(); wireGuide(el); }
  else if (state.view === 'coach') { el.innerHTML = viewCoach(); wireCoach(el); }
  else if (state.view === 'done' && state.lastSummary?.section === 'coach') { el.innerHTML = coachRecap(state.lastSummary); $('#cagain', el).onclick = () => startSection('coach', state.lastSummary.opt); $('#cback', el).onclick = () => { state.view = 'coach'; render(); }; }
  else if (state.view === 'done' && state.lastSummary?.section === 'grind') { el.innerHTML = grindRecap(state.lastSummary); $('#again', el).onclick = () => startSection('grind', LS.get('gopt', { skills: Object.keys(GSKILLS), size: 8 })); $('#gh', el).onclick = () => { state.view = 'grind'; render(); }; $('#again', el).focus(); }
  else if (state.view === 'done') { el.innerHTML = viewDone(); $('#home', el).onclick = () => { state.view = state.lastSummary?.section === 'practice' ? 'practice' : 'home'; render(); }; $('#res', el).onclick = () => { state.view = 'results'; render(); }; }
  else if (state.view === 'study') { el.innerHTML = viewStudy(); wireStudy(el); }
  else if (state.view === 'studyrun' && state.study) { renderStudy(); }
  else if (state.view === 'grind') { el.innerHTML = viewGrind(); wireGrind(el); }
  else if (state.view === 'practice') { el.innerHTML = viewPractice(); wirePractice(el); }
  else { el.innerHTML = viewResults() + `<div class="startover">${startOverHTML()}</div>`; wireResults(el); wireStartOver(el); }
}
document.querySelectorAll('.navb[data-view]').forEach(b => b.onclick = () => { TTS.stop(); state.view = b.dataset.view; render(); });
$('#brand').onclick = () => { TTS.stop(); state.view = 'home'; render(); };
$('#brand').onkeydown = e => { if (e.key === 'Enter') $('#brand').click(); };

/* ============================== ON-SCREEN KEYBOARD ============================== */
let lastInput = null;
document.addEventListener('focusin', e => { if (e.target.matches('[data-ru]')) lastInput = e.target; });
const KROWS = ['й ц у к е н г ш щ з х ъ', 'ф ы в а п р о л д ж э', 'я ч с м и т ь б ю ё'];
$('#kbd').innerHTML = KROWS.map(r => `<div class="krow">${r.split(' ').map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('')
  + `<div class="krow"><button class="key wide" data-k="-">-</button><button class="key wide" data-k=" ">space</button><button class="key wide" data-k="BS">⌫ delete</button><button class="key wide" data-k="EN">Enter</button></div>`;
$('#kbd').addEventListener('mousedown', e => e.preventDefault());
$('#kbd').addEventListener('click', e => {
  const k = e.target.closest('.key')?.dataset.k; if (!k) return;
  const inp = lastInput && document.contains(lastInput) && !lastInput.disabled ? lastInput : document.querySelector('[data-ru]:not(:disabled)');
  if (!inp) return;
  if (k === 'EN') { inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); return; }
  const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
  if (k === 'BS') { const a = s === en ? Math.max(0, s - 1) : s; inp.value = inp.value.slice(0, a) + inp.value.slice(en); inp.setSelectionRange(a, a); }
  else { inp.value = inp.value.slice(0, s) + k + inp.value.slice(en); inp.setSelectionRange(s + 1, s + 1); }
  inp.focus();
});
const kbdReveal = el => { if (!el || $('#kbd').hidden) return; const r = el.getBoundingClientRect(), kb = $('#kbd').getBoundingClientRect().top; if (r.bottom + 70 > kb || r.top < 8) window.scrollBy({ top: r.bottom + 76 - kb, behavior: 'smooth' }); };
document.addEventListener('focusin', e => { if (e.target.matches('input, textarea')) setTimeout(() => kbdReveal(e.target), 30); });
const setKbd = on => { $('#kbd').hidden = !on; document.body.classList.toggle('kbd-on', on); $('#kbdToggle').setAttribute('aria-pressed', on); $('#kbdToggle').textContent = on ? 'Hide keyboard' : 'Russian keyboard'; LS.set('kbd', on); if (on) setTimeout(() => kbdReveal(lastInput && document.body.contains(lastInput) ? lastInput : document.querySelector('#app input.ans, #app textarea.ans')), 30); };
$('#kbdToggle').onclick = () => setKbd($('#kbd').hidden);
setKbd(LS.get('kbd', false));

EXTRA_LESSONS.forEach(mergeLesson);
initBoxes();
render();
</script>
